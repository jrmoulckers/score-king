name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - index.html
      - package-lock.json
      - package.json
      - public/**
      - src/**
      - svelte.config.js
      - config/engineering/tsconfig/**
      - tsconfig*.json
      - vite.config.ts
  workflow_dispatch:

permissions: {}

jobs:
  pages:
    name: Build and deploy Pages
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    uses: jrmoulckers/.github/.github/workflows/reusable-deploy-pages.yml@5f6ff9e22d82be576e01d0b094315a202ccbd186
    with:
      node-version: '22'
      package-manager: npm
      build-command: npm run build
      output-dir: dist
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
