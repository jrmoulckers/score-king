name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  configs:
    name: Vendored config integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify vendored configs
        run: npm run configs:check

  lint:
    name: Lint policy
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@4162bad33b949a7cf5f2d0b1b88b33fd71324128
    with:
      node-version: '22'
      package-manager: npm
      lint-command: npm run lint
      format-check-command: npm run format:check
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'

  web:
    name: Web
    permissions:
      contents: read
      packages: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@4162bad33b949a7cf5f2d0b1b88b33fd71324128
    with:
      node-version: '22'
      package-manager: npm
      typecheck-command: npm run typecheck
      test-command: npm test
      build-command: npm run build
      artifact-name: score-king-web
      artifact-path: dist
      artifact-retention-days: 1
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'

  relay-typecheck:
    name: Relay typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install relay dependencies
        run: npm ci --prefix relay

      - name: Typecheck relay
        run: npm --prefix relay run typecheck

  security:
    name: Security
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@4162bad33b949a7cf5f2d0b1b88b33fd71324128
    with:
      node-version: '22'
      package-manager: npm
      audit-command: npm audit --omit=dev --audit-level=high
      run-dependency-review: false

  performance:
    name: Performance
    needs: web
    permissions:
      contents: read
      packages: read
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@4162bad33b949a7cf5f2d0b1b88b33fd71324128
    with:
      artifact-name: score-king-web
      output-dir: dist
      bundle-budget-kb: 2048
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
